<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Name Hunter Market</title>
<meta name="description" content="NEAR testnet account names, priced from real mainnet sales. Buy or bid via Telegram bot.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>body{margin:0}[hidden]{display:none!important}

/* Layout: registro di nomi-account in colonna unica, barra filtri appiccicata, scheda d'acquisto in fondo allo schermo */
:root{
  --bg:#eef2f0;--surface:#ffffff;--ink:#15201c;--muted:#5a6964;--line:#d6dfdb;
  --accent:#0d6b5b;--accent-ink:#ffffff;--auction:#9a5b14;--auction-bg:#f7ecdd;--sold:#7d8783;--warn-bg:#fff4d6;--warn-ink:#6b4a00;--rent:#4b3fa8;--rent-bg:#ebe8fb;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1311;--surface:#151d1a;--ink:#e4ece8;--muted:#93a39d;--line:#27322e;
  --accent:#45b89f;--accent-ink:#06120f;--auction:#e3a24f;--auction-bg:#2a2013;--sold:#6f7a76;--warn-bg:#2b2410;--warn-ink:#f0d48a;--rent:#b8adff;--rent-bg:#241f45;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1311;--surface:#151d1a;--ink:#e4ece8;--muted:#93a39d;--line:#27322e;
  --accent:#45b89f;--accent-ink:#06120f;--auction:#e3a24f;--auction-bg:#2a2013;--sold:#6f7a76;--warn-bg:#2b2410;--warn-ink:#f0d48a;--rent:#b8adff;--rent-bg:#241f45;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:18px 120px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font:700 clamp(26px,6vw,36px)/1.05 var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 .tn{color:var(--accent)}
.lead{color:var(--muted);margin:6px 0 0;max-width:60ch}
.lang{display:flex;gap:4px}
.lang button{font:600 12px var(--f-mono);letter-spacing:.06em;background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:5px 8px;cursor:pointer}
.lang button[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}
.notice{margin-top:14px;background:var(--warn-bg);color:var(--warn-ink);border-radius:var(--r);padding:12px 14px;font-size:14px}
.notice b{font-weight:600}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;color:var(--muted);font-size:13px}
.stats strong{color:var(--ink);font:700 16px var(--f-mono);font-variant-numeric:tabular-nums;margin-right:4px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:3;background:var(--bg);padding-block:12px 10px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.search{width:100%;font:500 16px var(--f-mono);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.search:focus,.field input:focus{outline:2px solid var(--accent);outline-offset:1px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{font:500 13px var(--f-body);background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:99px;padding:6px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.sort{margin-left:auto;font:500 13px var(--f-body);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
ul.list{list-style:none;margin:0;padding:0}
li.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:center;padding:14px 2px;border-bottom:1px solid var(--line)}
.acct{font:700 17px var(--f-mono);word-break:break-all;min-width:0}
.acct .sfx{color:var(--muted);font-weight:500}
.meta{grid-column:1;color:var(--muted);font-size:13px;min-width:0}
.tag{display:inline-block;font:600 11px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;border-radius:6px;padding:2px 6px;margin-right:6px;vertical-align:1px}
.tag.fix{background:var(--accent);color:var(--accent-ink)}
.tag.auc{background:var(--auction-bg);color:var(--auction)}
.tag.sold{background:transparent;border:1px solid var(--sold);color:var(--sold)}
.price{grid-row:1/span 2;grid-column:2;text-align:right;display:grid;gap:6px;justify-items:end}
.pn{font:700 18px var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.pe{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.btn{font:600 14px var(--f-body);border:0;border-radius:10px;padding:9px 14px;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.auc{background:var(--auction);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:focus-visible,.chip:focus-visible,.lang button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn:disabled{opacity:.45;cursor:default}
.more{display:flex;justify-content:center;padding-block:16px}
.empty{color:var(--muted);padding:28px 0;text-align:center}
.sheet{position:fixed;inset:auto 0 0 0;z-index:10;background:var(--surface);border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.18);max-height:88vh;overflow:auto;padding-inline:16px;padding-block:16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet .in{max-width:720px;margin:0 auto;display:grid;gap:12px}
.scrim{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.35)}
.sheet h2{font:700 22px var(--f-mono);margin:0;word-break:break-all}
.row2{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.field{display:grid;gap:4px}
.field label{font-size:13px;color:var(--muted)}
.field input,.field textarea{font:500 15px var(--f-mono);background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}
.field textarea{min-height:120px;font-size:13px;resize:vertical}
.hint{font-size:12px;color:var(--muted)}
ol.steps{margin:0;padding-left:20px;display:grid;gap:4px;font-size:14px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.copyline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font:500 14px var(--f-mono)}
.admin{margin-top:28px;border:1px dashed var(--line);border-radius:var(--r);padding:14px;display:grid;gap:14px}
.admin h3{font:700 16px var(--f-display);margin:0}
.admin .grp{display:grid;gap:8px;padding-top:10px;border-top:1px solid var(--line)}
.admin .g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.admin pre{margin:0;white-space:pre-wrap;word-break:break-all;font:12px var(--f-mono);background:var(--bg);border-radius:8px;padding:10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:14px;z-index:20}
footer{margin-top:22px;color:var(--muted);font-size:12px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(20px);opacity:.6}to{transform:none;opacity:1}}}

.botbox{display:grid;gap:10px;background:var(--bg);border-radius:var(--r);padding:12px}
.botbox .big{display:block;text-align:center;font-size:16px;padding:13px 16px;text-decoration:none}
.skeleton{color:var(--muted);padding:40px 0;text-align:center}

/* Affitti */
.tag.rent{background:var(--rent-bg);color:var(--rent)}
.btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.btn.sm{font-size:12.5px;padding:7px 10px}
@media (max-width:560px){.btns{flex-direction:column-reverse;align-items:stretch}.btns .btn{text-align:center}}
.subbox{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:8px}
.subbox h3{margin:0;font:700 17px var(--f-display)}
.subbox .hint{margin:0}
.subrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center}
.subrow .sort{margin-left:0;max-width:44vw}
@media (max-width:420px){.subrow{grid-template-columns:minmax(0,1fr) auto}.subrow .btn{grid-column:1/-1}}
.hint a,.steps a{color:var(--accent)}
</style>
</head>
<body>
<div id="root"><div class="wrap"><p class="skeleton">Carico il catalogo…</p></div></div>
<script src="app.js"></script>
</body>
</html>
