<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pannello inquilino · Name Hunter</title>
<meta name="description" content="Usa il nome NEAR che hai in affitto: ricevi e invia NEAR, usa contratti e app.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#eef2f0;--surface:#ffffff;--ink:#15201c;--muted:#5a6964;--line:#d6dfdb;
  --accent:#0d6b5b;--accent-ink:#ffffff;--warn-bg:#fff4d6;--warn-ink:#6b4a00;--bad:#b3261e;--rent:#4b3fa8;--rent-bg:#ebe8fb;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--r:12px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1311;--surface:#151d1a;--ink:#e4ece8;--muted:#93a39d;--line:#27322e;--accent:#45b89f;--accent-ink:#06120f;--warn-bg:#2b2410;--warn-ink:#f0d48a;--bad:#ff8a80;--rent:#b8adff;--rent-bg:#241f45;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1311;--surface:#151d1a;--ink:#e4ece8;--muted:#93a39d;--line:#27322e;--accent:#45b89f;--accent-ink:#06120f;--warn-bg:#2b2410;--warn-ink:#f0d48a;--bad:#ff8a80;--rent:#b8adff;--rent-bg:#241f45;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:18px 16px 80px;display:grid;gap:14px}
h1{font:700 clamp(26px,6vw,34px)/1.05 var(--f-display);margin:0}
h1 span{color:var(--rent)}
h2{font:700 18px var(--f-display);margin:0}
a{color:var(--accent)}
.lead,.hint{color:var(--muted);margin:0}
.hint{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px}
.notice{background:var(--warn-bg);color:var(--warn-ink);border-radius:var(--r);padding:12px 14px;font-size:14px}
.field{display:grid;gap:4px}
.field label{font-size:13px;color:var(--muted)}
input,textarea,select{font:500 15px var(--f-mono);background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}
textarea{min-height:90px;font-size:13px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.grid2{grid-template-columns:1fr}}
.btn{font:600 14px var(--f-body);border:0;border-radius:10px;padding:10px 14px;cursor:pointer;background:var(--accent);color:var(--accent-ink);text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.bad{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mono{font:500 13px var(--f-mono);word-break:break-all;background:var(--bg);border-radius:8px;padding:8px 10px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:480px){.kpis{grid-template-columns:1fr 1fr}}
.kpi{background:var(--bg);border-radius:10px;padding:10px}
.kpi b{display:block;font:700 18px var(--f-mono);font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.tag{display:inline-block;font:600 11px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;border-radius:6px;padding:2px 6px;background:var(--rent-bg);color:var(--rent)}
.tag.warn{background:var(--warn-bg);color:var(--warn-ink)}
.tag.bad{background:transparent;border:1px solid var(--bad);color:var(--bad)}
.out{font-size:13px;min-height:1em}
.out.ok{color:var(--accent)}.out.err{color:var(--bad)}
ul.apps{list-style:none;margin:0;padding:0;display:grid;gap:6px}
ul.apps li{display:flex;gap:8px;align-items:center;justify-content:space-between}
details summary{cursor:pointer;font-weight:600}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.lang{display:flex;gap:4px}
.lang button{font:600 12px var(--f-mono);background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:5px 8px;cursor:pointer}
.lang button[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}
</style>
</head>
<body>
<main class="wrap" id="root" aria-live="polite"><p class="hint">…</p></main>
<script type="module" src="inquilino.js"></script>
</body>
</html>
